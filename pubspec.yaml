name: obtainium
description: Get Android app updates straight from the source.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# ObtainX uses its own version line, independent of upstream Obtainium's.
version: 2.23.0+22300

environment:
  sdk: ^3.14.0
  # 3.50 deprecates the framework's flutter/material (the app is on
  # material_ui) and re-exports ScrollCacheExtent from the widgets library.
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.6
  flutter_fgbg: ^0.8.0
  flutter_local_notifications: ^23.0.3
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  http: ^1.6.0
  webview_flutter: ^4.14.1
  # Direct dependency only for AndroidWebViewController's platform-specific
  # inset opt-out, which the cross-platform package does not expose.
  webview_flutter_android: ^4.14.1
  # The app's Material library (the framework's flutter/material is deprecated
  # from Flutter 3.50). Same widgets and the same MaterialIcons font as the
  # framework copy. Packages still on flutter/material (the M3E indicators,
  # expressive_refresh, flutter_markdown_plus) get the app theme through
  # components/legacy_material_bridge.dart. Upstream migrated in #3258.
  material_ui: ^1.11.1
  # Upstream Material `dynamic_color` package. ObtainX calls only its platform
  # API (`DynamicColorPlugin.getCorePalette` / `getAccentColor`, see
  # utils/dynamic_color_utils.dart), which returns a palette and a Color, no
  # Material types, so 1.x works unchanged in the material_ui app.
  # Stays on 1.x on purpose: m3e_design (pulled in by progress_indicator_m3e)
  # requires dynamic_color ^1.8.1. Upstream Obtainium is on 2.x (#3258);
  # intentional divergence, do not "fix" until the M3E packages allow 2.x.
  dynamic_color: ^1.8.1
  # Direct only for utils/dynamic_color_utils.dart (#3322), which builds the
  # Material You scheme from the OS tonal palettes. Already locked through
  # the Flutter SDK, so no new transitive packages.
  material_color_utilities: ^0.13.0
  html: ^0.15.7
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  permission_handler: ^13.0.2
  # Pinned: 10.0.1+ applies the org.jetbrains.kotlin.android plugin, which
  # AGP 9's built-in Kotlin rejects, so the Android build fails. Unpin once
  # a fluttertoast release drops that plugin.
  fluttertoast: ^10.0.3
  device_info_plus: ^13.3.0
  animations: ^3.0.0
  android_package_installer: # TODO: Upstream PR pending; if not accepted, keep fork maintained
    git:
      url: https://github.com/ImranR98/android_package_installer
      ref: 94525707bd1fba8cba4d19b4cb2b928580913510
  android_package_manager: # TODO: Submit PR to upstream and switch back when merged
    git:
      url: https://github.com/ImranR98/android_package_manager
      ref: 997065dccfaae71c4b34699ade7eedf5eeb66cac
  share_plus: ^13.3.1
  sqflite: ^2.4.5
  easy_localization: ^3.0.8
  intl: ^0.20.3
  android_intent_plus: ^6.1.0
  flutter_archive: ^6.3.1
  archive: ^4.6.0
  hsluv: ^1.1.3
  connectivity_plus: ^7.3.1
  shared_storage: # TODO: Upstream maintenance uncertain; consider alternatives or fork to org
    git:
      url: https://github.com/AlexBacich/shared-storage
      ref: 6dbcdf2c2045e326f59c062f542724aedf73cb6e
  crypto: ^3.0.8
  collection: ^1.19.1
  # Direct for the Samsung Galaxy Store source (app_sources/samsunggalaxystore.dart).
  # Upstream uses ^7.1.0; flutter_svg (store icons) caps xml at 7.0.1.
  xml: ^7.0.1
  bcrypt: ^1.2.0
  app_links: ^7.2.2
  shizuku_apk_installer: # TODO: Forked dependency; watch upstream for releases
    git:
      url: https://github.com/ImranR98/shizuku_apk_installer
      ref: 447d88a0d134ec80d986064fdf458b55644d2ab3
  markdown: ^7.3.1
  flutter_typeahead: ^7.0.0
  battery_plus: ^7.1.2
  flutter_charset_detector: ^6.0.0
  flutter_markdown_plus: ^1.0.12
  workmanager: ^0.10.10
  flutter_foreground_task: ^11.0.0
  # Material 3 Expressive pull-to-refresh: drop-in replacement for the legacy
  # circular spinner inside RefreshIndicator with the M3E morphing-polygon
  # loading shape. MIT-licensed, mirrors RefreshIndicator's API exactly.
  expressive_refresh: ^0.1.2
  # Material 3 Expressive standalone loading indicator (the same morphing
  # polygon shape as inside ExpressiveRefreshIndicator). MIT, depends only
  # on flutter + material_new_shapes (already pulled by expressive_refresh)
  # so adds no new transitive deps and no dynamic_color collision risk.
  # Used to replace the hand-rolled BulkM3LoadingIndicator and stock
  # CircularProgressIndicator instances for visual consistency with the
  # pull-to-refresh.
  expressive_loading_indicator: ^0.0.1
  # Material 3 Expressive linear/circular progress indicators - the wavy
  # active-track variant. Replaces stock LinearProgressIndicator at the
  # main user-facing surfaces (refresh progress, install button overlay,
  # bulk-add per-store scan, import/export). Verified publisher
  # bruckcode.de, MIT, also via m3e_design.
  progress_indicator_m3e: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # FFI-backed sqflite so unit tests can construct AppsProvider (LogsProvider
  # opens a DB on construction).
  sqflite_common_ffi: any
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/graphics/icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/graphics/
    # CA roots for opt-in certificate pinning and RuStore's Mintsifry root
    # (services/http_service.dart).
    - assets/ca-certs/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  #
  # No bundled font: the app uses the device's OS system font (see
  # NativeFeatures.loadSystemFont / fontFamily handling in main.dart).
