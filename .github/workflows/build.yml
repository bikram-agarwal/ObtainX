name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug-signed for installable testing)
        run: |
          flutter build apk --debug --flavor normal
          for f in build/app/outputs/flutter-apk/app-*normal*.apk*; do
            [ -e "$f" ] && mv "$f" "${f//-normal/}" || true
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obtainx-apks-debug
          path: build/app/outputs/flutter-apk/*.apk
