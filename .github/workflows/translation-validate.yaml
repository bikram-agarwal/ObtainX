name: Validate translation files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'assets/translations/*.json'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

        # we only need the JSON files
      - name: Get JSON PR files
        id: changed
        # The changed translation files that still exist, on one line: jq
        # takes them as arguments, and a newline would end the command.
        # (The list used to go to stdout instead of $GITHUB_OUTPUT, so
        # nothing was ever validated.)
        run: |
          files=$(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" | grep -E '^assets/translations/.*\.json$' | tr '\n' ' ' || true)
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Validate
        if: steps.changed.outputs.files != ''
        run: |
          echo "Validating files: ${{ steps.changed.outputs.files }}"
          jq empty ${{ steps.changed.outputs.files }}
